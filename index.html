<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Penilaian Siswa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>📚 Kalkulator Nilai Akhir</h1>

    <label for="nama">Nama Siswa:</label>
    <input type="text" id="nama" placeholder="Contoh: Rina">

    <label for="tugas">Nilai Tugas:</label>
    <input type="number" id="tugas" min="0" max="100">

    <label for="uts">Nilai UTS:</label>
    <input type="number" id="uts" min="0" max="100">

    <label for="uas">Nilai UAS:</label>
    <input type="number" id="uas" min="0" max="100">

    <button onclick="hitungNilai()">Hitung Nilai Akhir</button>

    <div id="hasil" class="hasil-box hidden"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
